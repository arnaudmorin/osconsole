name: release

# Every push to main publishes a new release, bumping the patch number of
# the latest X.Y.Z tag (e.g. 0.0.3 -> 0.0.4). To bump the major or minor
# number, push the new tag (e.g. 0.1.0) yourself: the next push to main
# continues from it.
on:
  push:
    branches:
      - main

permissions:
  contents: write

# Never compute two versions at the same time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags are needed to compute the next version

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Compute next version
        id: version
        run: |
          last=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          IFS=. read -r major minor patch <<< "${last:-0.0.0}"
          version="$major.$minor.$((patch + 1))"
          echo "Last release: ${last:-none}, next: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w" -o "dist/osconsole-$os-$arch" .
          done
          # Keep the historical asset name for existing download links.
          cp dist/osconsole-linux-amd64 dist/osconsole
          (cd dist && sha256sum osconsole* > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
